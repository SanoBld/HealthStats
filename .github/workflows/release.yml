name: Release

# Push a tag like v1.0.0 (or run by hand) to publish a GitHub Release with the APK.
on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Work out version
        id: v
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$IN_VERSION" ]; then
            echo "version=$IN_VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$IN_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        run: |
          gradle assembleRelease --no-daemon \
            -PappVersion="${{ steps.v.outputs.version }}" \
            -PappBuild=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk HealthStats-${{ steps.v.outputs.version }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.v.outputs.version, '-') }}
          files: HealthStats-${{ steps.v.outputs.version }}.apk
