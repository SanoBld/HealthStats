name: Build HealthStats (Android)

# Build de vérification à chaque push touchant le code (sans créer de Release).
on:
  push:
    branches: [ main, master ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-*.yml'
  workflow_dispatch: {}

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - id: check
        run: |
          MSG=$(git log -1 --pretty=%B)
          if [[ "$MSG" == *"[skip ci]"* ]]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  android:
    needs: check-skip
    if: needs.check-skip.outputs.skip != 'true'
    uses: ./.github/workflows/build-android.yml
