name: Build Android

# Reusable: called by build-all.yml / release.yml, also runnable by hand.
# One Gradle run makes 4 APKs: universal + arm64-v8a + armeabi-v7a + x86_64.
# File names are what the in-app updater looks for, so do not rename them.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build (e.g. 2.7.0). Empty = dev build'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 2.7.0). Empty = dev build'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs Gradle 8.11.1 itself, so the repo does not need gradlew / the wrapper jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # No version given = dev build: it never pretends to be a real release.
      - name: Build release APKs
        shell: bash
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${IN_VERSION:-0.0.0-dev.${{ github.run_number }}}"
          gradle assembleRelease --no-daemon \
            -PappVersion="$VERSION" \
            -PappBuild=${{ github.run_number }} \
            -PgithubRepo=${{ github.repository }}

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-*-release.apk dist/
          ls -la dist
          test -f dist/app-universal-release.apk
          test -f dist/app-arm64-v8a-release.apk

      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: dist/*.apk
          if-no-files-found: error
